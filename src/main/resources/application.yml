server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20

spring:
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 240000
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none